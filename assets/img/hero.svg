  <rect y="200" width="1600" height="200" fill="url(#mist)"/>
  <!-- mid ridge -->
  <path d="M0 380 L90 330 L200 360 L310 300 L420 350 L540 290 L660 345 L780 300 L900 350 L1010 305 L1130 355 L1250 300 L1380 350 L1490 310 L1600 340 V600 H0Z" fill="#5f7390"/>
  <rect y="300" width="1600" height="160" fill="url(#mist)" opacity=".6"/>
  <!-- near forest ridge -->
  <path d="M0 440 L60 410 L140 430 L230 395 L330 425 L450 390 L560 420 L690 385 L800 415 L930 392 L1050 422 L1170 390 L1300 418 L1420 395 L1520 420 L1600 405 V600 H0Z" fill="#34465e"/>
