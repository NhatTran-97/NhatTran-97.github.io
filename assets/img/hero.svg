<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3b55"/><stop offset=".55" stop-color="#6f86a3"/><stop offset="1" stop-color="#b8c6d6"/>
    </linearGradient>
    <radialGradient id="glow" cx=".72" cy=".38" r=".35">
      <stop offset="0" stop-color="#f4e7d0" stop-opacity=".55"/><stop offset="1" stop-color="#f4e7d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d4e0" stop-opacity="0"/><stop offset="1" stop-color="#c9d4e0" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d93ad"/><stop offset="1" stop-color="#2a3a50"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="600" fill="url(#sky)"/>
  <rect width="1600" height="600" fill="url(#glow)"/>
  <!-- far snowy peaks -->
  <path d="M0 330 L120 250 L210 290 L330 170 L420 240 L520 150 L610 230 L720 120 L800 200 L880 140 L990 230 L1090 110 L1180 200 L1290 150 L1400 240 L1500 180 L1600 230 V600 H0Z" fill="#9aabc0"/>
