    <path d="M40 450 l12-38 12 38Z M80 452 l10-30 10 30Z M180 445 l14-44 14 44Z M260 448 l11-34 11 34Z M1330 446 l13-40 13 40Z M1380 450 l10-32 10 32Z M1460 444 l14-44 14 44Z M1530 450 l11-34 11 34Z"/>
