  <path d="M0 455 H1600" stroke="#c9d4e0" stroke-opacity=".5" stroke-width="2"/>
  <g stroke="#dfe7f0" stroke-opacity=".25" stroke-width="2">
    <path d="M200 490 h140 M620 510 h220 M1050 485 h160 M380 540 h120 M900 560 h200 M1300 530 h140"/>
