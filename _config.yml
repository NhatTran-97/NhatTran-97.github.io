# =====================================================================
#  CẤU HÌNH WEBSITE — thường chỉ sửa 1 lần.
#  Nội dung cá nhân nằm trong thư mục _data/ (profile.yml, cv.yml, ...)
# =====================================================================
title: Nhat Tran                       # tên hiển thị trên tab trình duyệt / Google
description: >-
  Personal portfolio of Nhat Tran — robotics & AI research, projects,
  publications and technical notes.
url: "https://nhattran-97.github.io"
baseurl: ""
lang: en
timezone: Asia/Ho_Chi_Minh

# Căn chữ (xem README mục 15):
#   left    = căn trái (khuyên dùng cho web: dễ đọc, không hở chữ)
#   justify = căn đều hai bên (tự ngắt từ; điện thoại nhỏ vẫn căn trái)
typography:
  text_align: left          # toàn bộ website
  post_text_align: left     # nội dung bài viết trong Notes

# ----- Không cần sửa phần dưới -----
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: /notes/:year/:title/
excerpt_separator: "<!--more-->"

plugins:
  - jekyll-seo-tag
  - jekyll-feed

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "" }
    values: { layout: default }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - assets/files/README.txt
