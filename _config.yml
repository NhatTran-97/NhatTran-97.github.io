# ===== Thông tin site — sửa các giá trị dưới đây =====
title: Nhat Tran
description: >-
  Personal academic portfolio — research, projects, publications and notes.
author:
  name: Nhat Tran
  position: Robotics & AI Engineer
  affiliation: Your University / Company
  email: your.email@example.com
  location: Ho Chi Minh City, Vietnam
  avatar: /assets/img/avatar.svg
  github: NhatTran-97
  linkedin: your-linkedin-id
  scholar: ""            # Google Scholar user id, ví dụ: abcdEFGhijk
  orcid: ""              # ví dụ: 0000-0000-0000-0000

url: "https://nhattran-97.github.io"
baseurl: ""

# Menu điều hướng (thứ tự hiển thị)
navigation:
  - title: About
    url: /
  - title: CV
    url: /cv/
  - title: Projects
    url: /projects/
  - title: Publications
    url: /publications/
  - title: Notes
    url: /notes/

# ===== Cấu hình build =====
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: /notes/:year/:title/
excerpt_separator: "<!--more-->"
timezone: Asia/Ho_Chi_Minh

plugins:
  - jekyll-seo-tag
  - jekyll-feed

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "" }
    values: { layout: default }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
