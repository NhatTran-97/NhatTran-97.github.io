# =====================================================================
#  PROJECTS
#
#  1) groups: các nhóm project, hiển thị thành từng khu riêng trên trang
#     Projects theo đúng thứ tự dưới đây. Đổi tên / thêm nhóm tuỳ ý.
#       id          : mã nhóm (viết liền, không dấu) — dùng ở trường "group" của project
#       title       : tiêu đề khu
#       label       : nhãn ngắn hiện ở góc ảnh project
#       description : một câu mô tả (tuỳ chọn)
#
#  2) categories (TUỲ CHỌN): bật thanh nút lọc theo lĩnh vực ở đầu trang Projects.
#     Mặc định đang TẮT (các dòng có dấu #). Khi có nhiều project, xoá dấu "# "
#     ở các dòng categories bên dưới để bật lại.
#
#  3) items: danh sách project, mỗi project bắt đầu bằng dấu "-"
#       title        : tên project
#       group        : id của nhóm ở trên (professional / personal ...)
#       org          : công ty / tổ chức (tuỳ chọn, hợp với project công ty)
#       category     : 1 lĩnh vực chính (hiện thành nhãn xanh trên thẻ),
#                      vd. Embedded & Hardware / Perception & AI / Autonomy
#                      — các mảng phụ ghi vào tags
#       period       : thời gian
#       image        : ảnh minh hoạ 16:9 (bỏ trống sẽ dùng ảnh mặc định)
#       tags         : công nghệ sử dụng
#       description  : mô tả ngắn (Markdown)
#       featured     : true → hiện trên trang Home
#       github / demo / paper / video : link (bỏ trống nếu không có,
#                                        project công ty thường không public code)
#       links        : link khác tuỳ ý, mỗi link gồm name + url (+ icon tuỳ chọn), vd.
#                        links:
#                          - name: News
#                            url: https://...
# =====================================================================

groups:
  - id: professional
    title: Professional Projects
    label: Professional
    icon: briefcase
    description: Projects from my work at the EIU FabLab.
  - id: personal
    title: Personal Projects
    label: Personal
    icon: user
    description: Research, side projects and open-source work done in my own time.

# categories:
#   - Embedded & Hardware
#   - Perception & AI
#   - Autonomy

items:
  # ---------- Professional ----------
  - title: Autonomous Mobile Robot
    group: professional
    org: EIU FabLab
    category: Autonomy
    image: /assets/img/projects/robot-nav.svg
    tags: [ROS 2, Nav2, Visual SLAM, Computer Vision]
    description: >-
      Autonomous ground robot running ROS 2 with Visual SLAM, computer-vision
      perception and autonomous navigation (Nav2), on top of custom low-level firmware.
    featured: true

  - title: Autonomous Drone
    group: professional
    org: EIU FabLab
    category: Autonomy
    image: /assets/img/projects/drone.svg
    tags: [ROS 2, Computer Vision, Embedded]
    description: >-
      Autonomous drone platform integrating onboard computer vision and ROS 2
      with the embedded flight hardware.
    featured: true

  - title: Robot Low-Level Firmware
    group: professional
    org: EIU FabLab
    category: Embedded & Hardware
    image: /assets/img/projects/embedded.svg
    tags: [RTOS, CAN bus, Modbus, Ethernet, SPI / I2C / UART]
    description: >-
      Firmware for robot controller boards on RTOS: peripheral drivers (SPI, I2C, UART)
      and CAN bus, Ethernet and Modbus communication, bridging sensors and actuators
      to the ROS 2 system.

  - title: EIU-Spark Delivery UAV
    group: professional
    org: EIU FabLab — mentor of team EIU-Spark
    category: Teaching & Mentoring
    period: "2026 – Ongoing (competition: October 2026)"
    image: /assets/img/projects/eiu-spark-drone.jpg
    tags: [UAV, ArUco, Computer Vision, Mentoring]
    description: >-
      Mentoring team **EIU-Spark** at the *Ho Chi Minh City Youth UAV-Drone Creativity
      and Control Competition 2026* (October 2026). The delivery drone flies semi-autonomously from the
      start point to a pickup station, identifies the parcel by its **ArUco marker**,
      picks it up and carries it to the drop-off point. *In progress — details coming soon.*

  - title: AUTO RACE 2025 — Student Teams
    group: professional
    org: EIU FabLab
    category: Teaching & Mentoring
    period: 2025
    image: /assets/img/projects/auto-race-2025.jpg
    tags: [Mentoring, Autonomous Vehicles, Competition]
    description: >-
      Mentored two EIU student teams at AUTO RACE 2025, the Southern Vietnam
      autonomous vehicle competition hosted by FPT University Can Tho — the teams
      won **2nd Prize** and **3rd Prize**.
    featured: true
    links:
      - name: News
        url: https://eiu.edu.vn/en/news/eiu-students-journey-of-hang-on-experience-and-learning-at-auto-race-2025/

  - title: Student Research — Best Paper Award, EIUSC 2025
    group: professional
    org: EIU FabLab — research mentor & co-author
    category: Teaching & Mentoring
    period: Dec 2025
    image: /assets/img/projects/eiusc-2025-best-paper.jpg
    tags: [AEB, Kalman Filter, Autonomous Racing, Research]
    description: >-
      Mentored an EIU student team on the paper *"Developing An Autonomous Emergency
      Braking System-Based Kalman Filtering For An Autonomous Racing Car"*, presented at
      the EIUSC International Conference 2025 (Ho Chi Minh City, 3 December 2025) — it
      received the **Best Paper Award** in the student session.
    links:
      - name: Paper
        url: /publications/
        icon: file-text
      - name: Experiment video
        url: https://www.youtube.com/watch?v=ciiAT0cPrqc&t=63s
        icon: youtube

  - title: Weekly Robotics Workshop Series
    group: professional
    org: EIU FabLab
    category: Teaching & Mentoring
    period: Jan 2025 – Present
    image: /assets/img/projects/workshop.svg
    tags: [ROS 2, Drones, Embedded, Robotics]
    description: >-
      Organize and teach weekly hands-on workshops for students on robotics,
      ROS 2, drones and embedded systems.

