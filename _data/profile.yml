# ----- Trang About -----
about:
  subtitle: A little bit about who I am, my background, and what I'm passionate about.
  # Đoạn ngắn hiện trên trang Home
  summary: >-
    I work on autonomous robots and drones across the full stack — from PCB design and
    low-level firmware (SPI, I2C, CAN bus, Ethernet, Modbus on RTOS) to Visual SLAM, computer
    vision and the ROS 2 navigation stack. I also run weekly workshops on robotics and embedded systems.
  # Phần giới thiệu đầy đủ trên trang About (viết Markdown, có thể nhiều đoạn)
  intro: |
    I am a **FabLab Technician** at *Eastern International University (EIU)*, where
    since 2018 I have been building autonomous robots and autonomous drones across
    the whole robot pipeline.

    On the **low level**, I design robot controller boards in Altium Designer and write
    their firmware on RTOS — drivers and communication over SPI, I2C, UART, CAN bus,
    Ethernet and Modbus. On the **high level**,
    I work on autonomous systems with ROS 2: Visual SLAM, computer vision and the Nav2
    navigation stack, where I write custom planner and controller plugins and
    ros2_control hardware interfaces for our robots.
    I enjoy connecting these layers — understanding how a timing issue in the firmware
    shows up as drift in SLAM, or how perception changes what the robot can do.

    I also organize a **weekly workshop series** at the FabLab, teaching students
    robotics, ROS 2, drones and embedded systems, and mentor student teams in annual
    robotics competitions — at **AUTO RACE 2025**, two of our teams won **2nd and 3rd Prize**.
    I also supervise student research; our paper at the **EIUSC International Conference 2025**
    received the **Best Paper Award (Student Session)**.
  interests:
    - Embedded Systems
    - Edge AI
    - Computer Vision
    - Robot Perception
    - SLAM
    - Motion Planning & Control
    - ROS 2

