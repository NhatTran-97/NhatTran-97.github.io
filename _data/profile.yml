# ----- Trang About -----
about:
  subtitle: A little bit about who I am, my background, and what I'm passionate about.
  # Đoạn ngắn hiện trên trang Home
  summary: >-
    I am a robotics engineer working across the full robot stack — from embedded
    firmware and sensor integration, through computer vision and AI perception,
    to SLAM, planning and control. I enjoy building reliable systems that run on real robots.
  # Phần giới thiệu đầy đủ trên trang About (viết Markdown, có thể nhiều đoạn)
  intro: |
    I am a **robotics engineer** at *Company Name*, where I work across the whole
    robot pipeline: firmware for sensor and motor-control boards, perception models
    running on NVIDIA Jetson, and the navigation stack for a fleet of autonomous mobile robots.

    I like connecting the layers — understanding how a timing issue in the firmware
    shows up as drift in SLAM, or how a faster model changes what the planner can do.
    Before joining industry, I was a research assistant at *Lab Name*, working on
    visual-inertial SLAM.

    Outside of work, I like hiking, photography and writing technical notes on this site.
  interests:
    - Embedded Systems
    - Edge AI
    - Computer Vision
    - Robot Perception
    - SLAM
    - Motion Planning & Control
    - ROS 2

# ----- Số mục hiển thị trên trang Home (đặt 0 để ẩn phần đó) -----
home:
