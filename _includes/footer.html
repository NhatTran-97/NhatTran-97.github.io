{%- assign p = site.data.profile -%}
<footer class="site-footer">
  <div class="container footer-inner">
    <span>&copy; {{ 'now' | date: '%Y' }} {{ p.name }}. Built with Jekyll &amp; GitHub Pages.</span>
    <span class="footer-social">
      {%- for c in p.contacts -%}
        {%- if c.url %}
      <a href="{{ c.url }}" aria-label="{{ c.label }}" title="{{ c.label }}">{% include icon.html name=c.icon %}</a>
        {%- endif -%}
      {%- endfor %}
    </span>
  </div>
</footer>
