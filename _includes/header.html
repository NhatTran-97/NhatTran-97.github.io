<header class="site-header">
  <div class="container header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
    <nav class="site-nav">
      {% for item in site.navigation %}
        {% assign active = false %}
        {% if item.url == '/' %}
          {% if page.url == '/' %}{% assign active = true %}{% endif %}
        {% elsif page.url contains item.url %}
          {% assign active = true %}
        {% endif %}
        <a href="{{ item.url | relative_url }}"{% if active %} class="active"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
